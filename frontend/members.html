<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - Library Management System</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" href="favicon.svg">
    <lin1k rel="mask-icon" href="favicon.svg" color="#2563eb">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-small">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </div>
                <h2>Library MS</h2>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="books.html" class="nav-item">
                    <span class="icon">📚</span>
                    <span>Books</span>
                </a>
                <a href="members.html" class="nav-item active">
                    <span class="icon">👥</span>
                    <span>Members</span>
                </a>
                <a href="loans.html" class="nav-item">
                    <span class="icon">🔄</span>
                    <span>Loans</span>
                </a>
                <a href="fines.html" class="nav-item">
                    <span class="icon">💰</span>
                    <span>Fines</span>
                </a>
                <a href="reports.html" class="nav-item">
                    <span class="icon">📈</span>
                    <span>Reports</span>
                </a>
                <a href="staff.html" class="nav-item" id="staffLink" style="display: none;">
                    <span class="icon">👔</span>
                    <span>Staff</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button onclick="logout()" class="btn btn-danger btn-block">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <div>
                    <h1>Members Management</h1>
                    <p class="text-muted">Manage library members</p>
                </div>
                <button class="btn btn-primary" onclick="showAddModal()">+ Add Member</button>
            </header>

            <!-- Search Bar -->
            <div class="search-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="Search by name, email, or membership number...">
                <button class="btn btn-primary" onclick="loadMembers()">Search</button>
            </div>

            <!-- Members Table -->
            <div class="card">
                <div class="card-body">
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Membership No</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Join Date</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="membersTable">
                                <tr>
                                    <td colspan="7" class="text-center">
                                        <div class="loader" style="margin: 20px auto;"></div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Member Modal -->
    <div id="memberModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add Member</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="memberForm">
                    <input type="hidden" id="memberId">
                    
                    <div class="form-group">
                        <label for="membershipNo">Membership Number *</label>
                        <input type="text" id="membershipNo" placeholder="e.g., M001" required>
                    </div>

                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone *</label>
                        <input type="tel" id="phone" placeholder="+91XXXXXXXXXX" required>
                    </div>

                    <div class="form-group">
                        <label for="joinDate">Join Date *</label>
                        <input type="date" id="joinDate" required>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="active" checked>
                            Active Member
                        </label>
                    </div>

                    <div id="modalError" class="error-message" style="display: none;"></div>
                    <div id="modalSuccess" class="success-message" style="display: none;"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveMember()">Save Member</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/members.js"></script>
</body>
</html>
