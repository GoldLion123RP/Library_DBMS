<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Library Management System</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" href="favicon.svg">
    <link rel="mask-icon" href="favicon.svg" color="#2563eb">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-small">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </div>
                <h2>Library MS</h2>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item active">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="books.html" class="nav-item">
                    <span class="icon">📚</span>
                    <span>Books</span>
                </a>
                <a href="members.html" class="nav-item">
                    <span class="icon">👥</span>
                    <span>Members</span>
                </a>
                <a href="loans.html" class="nav-item">
                    <span class="icon">🔄</span>
                    <span>Loans</span>
                </a>
                <a href="fines.html" class="nav-item">
                    <span class="icon">💰</span>
                    <span>Fines</span>
                </a>
                <a href="reports.html" class="nav-item">
                    <span class="icon">📈</span>
                    <span>Reports</span>
                </a>
                <a href="staff.html" class="nav-item" id="staffLink" style="display: none;">
                    <span class="icon">👔</span>
                    <span>Staff</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button onclick="logout()" class="btn btn-danger btn-block">Logout</button>
            </div>
        </aside>

        <!-- Sidebar Overlay for Mobile -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="page-header">
                <div>
                    <!-- Hamburger Menu Button -->
                    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <div>
                        <h1>Dashboard</h1>
                        <p class="text-muted">Welcome back, <span id="userName"></span>!</p>
                    </div>
                </div>
                <div class="user-info">
                    <span class="badge" id="userRole"></span>
                </div>
            </header>

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card stat-blue">
                    <div class="stat-icon">📚</div>
                    <div class="stat-details">
                        <h3 id="totalBooks">0</h3>
                        <p>Total Books</p>
                    </div>
                </div>

                <div class="stat-card stat-green">
                    <div class="stat-icon">👥</div>
                    <div class="stat-details">
                        <h3 id="totalMembers">0</h3>
                        <p>Active Members</p>
                    </div>
                </div>

                <div class="stat-card stat-yellow">
                    <div class="stat-icon">🔄</div>
                    <div class="stat-details">
                        <h3 id="activeLoans">0</h3>
                        <p>Active Loans</p>
                    </div>
                </div>

                <div class="stat-card stat-red">
                    <div class="stat-icon">⚠️</div>
                    <div class="stat-details">
                        <h3 id="overdueBooks">0</h3>
                        <p>Overdue Books</p>
                    </div>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="dashboard-grid">
                <!-- Books by Category -->
                <div class="card">
                    <div class="card-header">
                        <h3>Books by Category</h3>
                    </div>
                    <div class="card-body">
                        <div id="categoryChart" class="chart-container">
                            <div class="loader"></div>
                        </div>
                    </div>
                </div>

                <!-- Recent Activity -->
                <div class="card">
                    <div class="card-header">
                        <h3>Recent Loans</h3>
                    </div>
                    <div class="card-body">
                        <div id="recentLoans">
                            <div class="loader"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Unpaid Fines -->
            <div class="card">
                <div class="card-header">
                    <h3>Financial Summary</h3>
                </div>
                <div class="card-body">
                    <div class="financial-stats">
                        <div class="financial-item">
                            <span>Total Unpaid Fines:</span>
                            <strong class="text-red">₹<span id="unpaidFines">0</span></strong>
                        </div>
                        <div class="financial-item">
                            <span>Number of Unpaid Fines:</span>
                            <strong><span id="unpaidCount">0</span></strong>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/mobile.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
